# Pulls the YouTube channel's Shorts into src/data/youtubeShorts.json and, if anything
# changed, pushes the update to master so Netlify deploys it.
# Requires the YOUTUBE_API_KEY repository secret (a YouTube Data API v3 key).
name: Sync YouTube Shorts

on:
  schedule:
    - cron: "17 22 * * *" # daily, after the channel's usual 20:00–21:00 UTC uploads
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-youtube-shorts

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Fetch shorts from YouTube
        run: npm run sync:shorts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Don't push anything that would break the deploy (e.g. a slug clash with a hand-written video).
      - name: Test and build
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/data/youtubeShorts.json
          git commit -m "Sync YouTube Shorts"
          git pull --rebase origin master
          git push origin HEAD:master
